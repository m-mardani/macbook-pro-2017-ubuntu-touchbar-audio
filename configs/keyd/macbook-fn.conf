# /etc/keyd/macbook-fn.conf
# Touch Bar MacBook Pro with a dead Touch Bar: Fn + number row -> F1..F12.
#
# TEMPORARY. keyd holds the keyboard exclusively, so the Touch Bar driver never
# sees Fn. Disable keyd once the Touch Bar works:  sudo systemctl disable --now keyd
#
# Replace the id below with the one of your own "Apple SPI Keyboard":
#   sudo journalctl -u keyd -b | grep -i 'Apple SPI Keyboard'
[ids]
0000:0000:caea9b11

[main]
fn = layer(fkeys)

[fkeys]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
